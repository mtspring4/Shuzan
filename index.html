<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>そろばん たしざん</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #f0fdf4;
      background-image: linear-gradient(
        -45deg, 
        rgba(255, 255, 255, 0.7) 25%, 
        transparent 25%, 
        transparent 50%, 
        rgba(255, 255, 255, 0.7) 50%, 
        rgba(255, 255, 255, 0.7) 75%, 
        transparent 75%, 
        transparent
      );
      background-size: 40px 40px;
      animation: moveStripe 2s linear infinite;
      touch-action: manipulation;
    }
    @keyframes moveStripe {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }
    .soroban-wrapper {
      transition: transform 0.3s ease, margin-bottom 0.3s ease;
      transform-origin: top center;
    }
    .soroban-large {
      transform: scale(1.5);
      margin-bottom: 110px;
    }
    .soroban-container {
      background-color: #d97706; 
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    canvas {
      background-color: #fef3c7;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }
    .hissan-active {
      background-color: #fef08a;
      border-radius: 4px;
      color: #dc2626;
    }
    button {
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="text-gray-800 h-screen flex flex-col items-center">

  <!-- ホーム画面 -->
  <div id="homeScreen" class="flex flex-col items-center justify-start w-full h-full max-w-md p-4 relative pt-12">
    <div class="absolute top-4 right-4">
      <button onclick="openSettings()" class="p-2 bg-white rounded-full shadow-md text-gray-600 border border-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
    
    <div class="w-full text-center mb-6">
      <span class="bg-blue-100 text-blue-600 font-bold px-6 py-2 rounded-full text-sm shadow-sm tracking-widest inline-block">
        PICO PICO もんだいしゅう
      </span>
    </div>

    <h1 class="text-3xl font-bold text-green-600 mb-6 text-center leading-tight">そろばん たしざん<br>れんしゅう</h1>
    
    <p class="text-sm font-bold text-gray-600 mb-8 text-center">そろばんがある子は、そろばんをよういしてね</p>

    <div class="w-full space-y-4">
      <button onclick="startGame('intro')" class="w-full py-4 bg-pink-400 text-white text-xl font-bold rounded-2xl shadow-lg border-b-4 border-pink-600">
        すうじのおきかた
      </button>
      <button onclick="startGame('1digit')" class="w-full py-4 bg-blue-400 text-white text-xl font-bold rounded-2xl shadow-lg border-b-4 border-blue-600">
        1けた ＋ 1けた
      </button>
      <button onclick="startGame('2digit1')" class="w-full py-4 bg-green-400 text-white text-xl font-bold rounded-2xl shadow-lg border-b-4 border-green-600">
        2けた ＋ 1けた
      </button>
      <button onclick="startGame('2digit2')" class="w-full py-4 bg-purple-400 text-white text-xl font-bold rounded-2xl shadow-lg border-b-4 border-purple-600">
        2けた ＋ 2けた
      </button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="gameScreen" class="hidden flex-col items-center w-full h-full max-w-md p-4 overflow-y-auto">
    <!-- ヘッダーと問題 -->
    <div class="w-full flex justify-between items-center mb-2">
      <button onclick="backToHome()" class="px-4 py-2 bg-gray-200 rounded-full text-sm font-bold shadow">もどる</button>
      <div class="flex flex-col items-center">
        <div id="qCountText" class="text-sm font-bold text-gray-500 mb-1 tracking-widest">だい１もん</div>
        <h2 id="questionTitle" class="text-2xl font-bold text-gray-700">？ ＋ ？ ＝ ？</h2>
      </div>
      <button onclick="openSettings()" class="p-2 bg-white rounded-full shadow text-gray-600 border border-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>

    <!-- 筆算エリア -->
    <div id="hissanArea" class="bg-white p-4 rounded-xl shadow-md w-48 flex justify-center mb-4 text-3xl font-bold tracking-widest relative mx-auto">
      <div class="flex flex-col items-end font-mono">
        <!-- 上の数字 -->
        <div class="grid grid-cols-2 gap-2 w-16 mb-1 text-right">
          <div id="hTop10" class="text-center rounded transition-colors duration-300"></div>
          <div id="hTop1" class="text-center rounded transition-colors duration-300"></div>
        </div>
        <!-- 下の数字 -->
        <div class="flex items-center w-full">
          <div class="text-2xl mr-2">＋</div>
          <div class="grid grid-cols-2 gap-2 w-16 text-right">
            <div id="hBot10" class="text-center rounded transition-colors duration-300"></div>
            <div id="hBot1" class="text-center rounded transition-colors duration-300"></div>
          </div>
        </div>
        <!-- 横線 -->
        <div class="w-full h-1 bg-gray-800 my-2"></div>
        <!-- こたえ -->
        <div id="hResCont" class="flex justify-end w-full text-red-500 opacity-0 transition-opacity duration-300">
          <div class="grid grid-cols-3 gap-1 w-24 text-right">
            <div id="hRes100" class="text-center"></div>
            <div id="hRes10" class="text-center"></div>
            <div id="hRes1" class="text-center"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- introモード用メッセージエリア -->
    <div id="introMessageArea" class="hidden bg-white py-6 px-4 rounded-xl shadow-md w-64 mx-auto mb-4 text-2xl font-bold text-gray-800 tracking-widest text-center border-4 border-pink-100">
      「<span id="introTargetNum" class="text-pink-600 mx-1 text-5xl font-black"></span>」を<br>おこう
    </div>

    <!-- 解説メッセージエリア -->
    <div id="explainBox" class="hidden w-full bg-blue-50 border-4 border-blue-200 p-4 rounded-xl shadow-sm mb-4 min-h-[7rem] flex items-center justify-center relative">
      <div id="sorobanMessage" class="text-lg text-center font-bold text-gray-700 leading-relaxed w-full">
        かいせつ を みてね！
      </div>
    </div>

    <!-- そろばんエリア -->
    <div class="w-full mb-4 relative flex justify-center mt-2">
      <div id="sorobanWrapper" class="soroban-wrapper">
        <div class="soroban-container">
          <div id="digitLabels" class="w-[240px] mx-auto grid grid-cols-3 text-center font-bold text-[#8B4513] mb-1 text-sm tracking-widest">
            <div>百</div>
            <div>十</div>
            <div>一</div>
          </div>
          <canvas id="sorobanCanvas" width="240" height="200"></canvas>
        </div>
      </div>
    </div>

    <!-- 操作ボタンエリア -->
    <div id="initialButtons" class="w-full flex space-x-4 mb-4">
      <button onclick="startExplain()" class="flex-1 py-3 bg-yellow-400 text-yellow-900 text-lg font-bold rounded-xl shadow-md border-b-4 border-yellow-600">
        かいせつをみる
      </button>
      <button onclick="showAnswerInstantly()" class="flex-1 py-3 bg-red-400 text-white text-lg font-bold rounded-xl shadow-md border-b-4 border-red-600">
        こたえあわせ
      </button>
    </div>

    <!-- 解説中の操作ボタン -->
    <div id="explainButtons" class="hidden w-full flex space-x-4 mb-4">
      <button onclick="replayCurrentStep()" class="flex-1 py-3 bg-gray-300 text-gray-700 text-lg font-bold rounded-xl shadow-md border-b-4 border-gray-500">
        もういちど
      </button>
      <button id="nextStepBtn" onclick="nextExplainStep()" class="flex-1 py-3 bg-blue-500 text-white text-lg font-bold rounded-xl shadow-md border-b-4 border-blue-700">
        つぎへ
      </button>
    </div>

    <button id="nextQuestionBtn" onclick="nextQuestion()" class="hidden w-full py-4 bg-green-500 text-white text-xl font-bold rounded-xl shadow-md border-b-4 border-green-700 mb-8">
      つぎのもんだい
    </button>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl max-w-sm w-full mx-4 shadow-xl">
      <h3 class="text-xl font-bold mb-4 text-center text-gray-800">せってい</h3>
      
      <label class="flex items-center space-x-3 mb-6 cursor-pointer bg-gray-50 p-4 rounded-xl border border-gray-200">
        <input type="checkbox" id="largeSorobanCheck" class="w-6 h-6 text-blue-600 rounded focus:ring-blue-500" onchange="toggleLargeSoroban(this.checked)">
        <span class="text-lg font-bold text-gray-700">そろばんを大きくひょうじ</span>
      </label>
      
      <button onclick="closeSettings()" class="w-full py-3 bg-blue-500 text-white text-lg font-bold rounded-xl shadow-md border-b-4 border-blue-700">
        とじる
      </button>
    </div>
  </div>

  <!-- introモード開始モーダル -->
  <div id="introModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-3xl max-w-sm w-full mx-4 shadow-2xl text-center">
      <h2 class="text-2xl font-black text-pink-600 mb-6 leading-relaxed">
        1 から 9 の<br>すうじのおきかたを<br>おぼえよう！
      </h2>
      <button onclick="closeIntroModal()" class="w-full py-4 bg-pink-500 text-white text-xl font-bold rounded-xl shadow-md border-b-4 border-pink-700">
        はじめる
      </button>
    </div>
  </div>

  <!-- クリアモーダル -->
  <div id="clearModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-3xl max-w-sm w-full mx-4 shadow-2xl text-center">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-2xl font-black text-yellow-500 mb-6 leading-relaxed">
        ぜんぶ おわったよ！<br>すごい！
      </h2>
      <button onclick="backToHomeFromClear()" class="w-full py-4 bg-blue-500 text-white text-xl font-bold rounded-xl shadow-md border-b-4 border-blue-700">
        ホームにもどる
      </button>
    </div>
  </div>

  <script>
    let mode = '1digit';
    let questionCount = 1;
    let qA = 0;
    let qB = 0;
    
    let activeColumns = [];
    let beadState = {};

    let isInteractive = true;
    let explainSteps = [];
    let currentStep = 0;
    
    let animationId = null;
    let onAnimationComplete = null;
    let currentAnimSpeed = 0.12; 
    let currentAnimStep = null;
    let currentActionIndex = 0;
    let sequenceTimeoutId = null;
    let resetColorTimeoutId = null;

    let ghostAnimationId = null;
    let ghostState = { active: false, colIndex: 0, val: 0, progress: 0 };

    const canvas = document.getElementById('sorobanCanvas');
    const ctx = canvas.getContext('2d');

    let isAudioInitialized = false;
    let buttonSynth, beadSynth, melodySynth;

    async function initAudio() {
      if (isAudioInitialized) return;
      await Tone.start();
      
      buttonSynth = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
      }).toDestination();
      buttonSynth.volume.value = -8;

      beadSynth = new Tone.MembraneSynth({
        pitchDecay: 0.01,
        octaves: 2,
        oscillator: { type: 'square' },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 }
      }).toDestination();
      beadSynth.volume.value = -12;

      melodySynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
      }).toDestination();
      melodySynth.volume.value = -8;

      isAudioInitialized = true;
    }

    function playButtonSound() {
      if (isAudioInitialized && buttonSynth) {
        buttonSynth.triggerAttackRelease("C6", "32n");
      }
    }

    function playBeadSound() {
      if (isAudioInitialized && beadSynth) {
        const pitches = ["C5", "C#5", "D5"];
        const pitch = pitches[Math.floor(Math.random() * pitches.length)];
        beadSynth.triggerAttackRelease(pitch, "32n");
      }
    }

    function playSuccessMelody() {
      if (isAudioInitialized && melodySynth) {
        const now = Tone.now();
        melodySynth.triggerAttackRelease("E5", "16n", now);
        melodySynth.triggerAttackRelease("G5", "16n", now + 0.1);
        melodySynth.triggerAttackRelease("C6", "4n", now + 0.2);
      }
    }

    document.addEventListener('pointerdown', async (e) => {
      await initAudio();
      if (e.target.closest('button')) {
        playButtonSound();
      }
    });

    function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
    function toggleLargeSoroban(isChecked) {
      const wrapper = document.getElementById('sorobanWrapper');
      if (isChecked) {
        wrapper.classList.add('soroban-large');
      } else {
        wrapper.classList.remove('soroban-large');
      }
      localStorage.setItem('largeSoroban', isChecked);
    }

    function setupCanvasForMode() {
      const digitLabels = document.getElementById('digitLabels');
      if (mode === 'intro') {
        canvas.width = 80;
        activeColumns = [{ id: '1s', x: 40, value: 0 }];
        digitLabels.className = "w-[80px] mx-auto grid grid-cols-1 text-center font-bold text-[#8B4513] mb-1 text-sm tracking-widest";
        digitLabels.innerHTML = '<div>一</div>';
        document.getElementById('hissanArea').classList.add('hidden');
        document.getElementById('introMessageArea').classList.remove('hidden');
      } else {
        canvas.width = 240;
        activeColumns = [
          { id: '100s', x: 40, value: 0 },
          { id: '10s',  x: 120, value: 0 },
          { id: '1s',   x: 200, value: 0 }
        ];
        digitLabels.className = "w-[240px] mx-auto grid grid-cols-3 text-center font-bold text-[#8B4513] mb-1 text-sm tracking-widest";
        digitLabels.innerHTML = '<div>百</div><div>十</div><div>一</div>';
        document.getElementById('hissanArea').classList.remove('hidden');
        document.getElementById('introMessageArea').classList.add('hidden');
      }
    }

    function closeIntroModal() {
      document.getElementById('introModal').classList.add('hidden');
      generateQuestion();
    }

    function showClearModal() {
      document.getElementById('clearModal').classList.remove('hidden');
      playSuccessMelody();
    }

    function backToHomeFromClear() {
      document.getElementById('clearModal').classList.add('hidden');
      backToHome();
    }

    function backToHome() {
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('flex');
      document.getElementById('homeScreen').classList.remove('hidden');
      clearAnimationQueue();
    }

    function startGame(selectedMode) {
      mode = selectedMode;
      questionCount = 1;
      document.getElementById('homeScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('gameScreen').classList.add('flex');
      
      setupCanvasForMode();

      if (mode === 'intro') {
        document.getElementById('introModal').classList.remove('hidden');
      } else {
        generateQuestion();
      }
    }

    function nextQuestion() {
      questionCount++;
      generateQuestion();
    }

    function generateQuestion() {
      if (mode === 'intro') {
        if (questionCount > 9) {
          showClearModal();
          return;
        }
        qA = questionCount;
        qB = 0;
        document.getElementById('qCountText').innerText = `だい ${questionCount} もん`;
        document.getElementById('questionTitle').innerText = `すうじのおきかた`;
        document.getElementById('introTargetNum').innerText = qA;
      } else if (mode === '1digit') {
        qA = Math.floor(Math.random() * 9) + 1;
        qB = Math.floor(Math.random() * 9) + 1;
      } else if (mode === '2digit1') {
        qA = Math.floor(Math.random() * 90) + 10;
        qB = Math.floor(Math.random() * 9) + 1;
      } else {
        qA = Math.floor(Math.random() * 90) + 10;
        qB = Math.floor(Math.random() * 90) + 10;
        if (qA + qB > 999) {
          qA = 50; qB = 40;
        }
      }

      if (mode !== 'intro') {
        document.getElementById('qCountText').innerText = `だい ${questionCount} もん`;
        document.getElementById('questionTitle').innerText = `${qA} ＋ ${qB} ＝ ？`;
        
        let aStr = String(qA).padStart(2, ' ');
        document.getElementById('hTop10').innerText = aStr[0] === ' ' ? '' : aStr[0];
        document.getElementById('hTop1').innerText = aStr[1];
        
        let bStr = String(qB).padStart(2, ' ');
        document.getElementById('hBot10').innerText = bStr[0] === ' ' ? '' : bStr[0];
        document.getElementById('hBot1').innerText = bStr[1];
        
        document.getElementById('hRes100').innerText = '';
        document.getElementById('hRes10').innerText = '';
        document.getElementById('hRes1').innerText = '';

        const resCont = document.getElementById('hResCont');
        resCont.style.transition = 'none'; 
        resCont.classList.remove('opacity-100');
        resCont.classList.add('opacity-0');
        requestAnimationFrame(() => { resCont.style.transition = ''; });
        
        document.getElementById('hTop10').classList.remove('hissan-active');
        document.getElementById('hTop1').classList.remove('hissan-active');
        document.getElementById('hBot10').classList.remove('hissan-active');
        document.getElementById('hBot1').classList.remove('hissan-active');
      }

      document.getElementById('explainBox').classList.add('hidden');
      document.getElementById('initialButtons').classList.remove('hidden');
      document.getElementById('explainButtons').classList.add('hidden');
      document.getElementById('nextQuestionBtn').classList.add('hidden');
      
      isInteractive = true;
      currentAnimSpeed = 0.12;

      initSoroban();
      setSorobanValueInstantly(0); 
      
      if (mode === 'intro') {
        buildIntroSteps(qA);
      } else {
        buildSteps(qA, qB);
      }
    }

    function setAnswerText() {
      let resStr = String(qA + qB).padStart(3, ' ');
      document.getElementById('hRes100').innerText = resStr[0] === ' ' ? '' : resStr[0];
      document.getElementById('hRes10').innerText = resStr[1] === ' ' ? '' : resStr[1];
      document.getElementById('hRes1').innerText = resStr[2];
    }

    function getAddExplainInfo(a, b, is10sColumn, currentVal, multiplier) {
      if (b === 0) return [];
      
      let actions = [];
      let colName = is10sColumn ? "十のくらい" : "一のくらい";
      let targetColName = is10sColumn ? "百のくらい" : "十のくらい";
      
      actions.push({ text: `つぎは、${colName}に「${b}」を足すよ。<br>`, val: currentVal, isTextOnly: true });
      
      if (a + b < 10) {
        let n1 = a % 5;
        let n5 = Math.floor(a / 5);
        let b1 = b % 5;
        
        let canPlaceDirectly = false;
        if (b < 5) {
          if (n1 + b < 5) canPlaceDirectly = true;
        } else {
          if (n5 === 0 && n1 + b1 < 5) canPlaceDirectly = true;
        }
        
        if (canPlaceDirectly) {
          actions.push({ text: `そのまま「${b}」をおくよ。`, val: currentVal + b * multiplier });
        } else {
          let comp5 = 5 - b;
          actions.push({ text: `「${b}」はおけないから、<br>`, val: currentVal, ghost: { colIndex: is10sColumn ? 1 : 2, val: b }, isTextOnly: true }); 
          actions.push({ text: `5をおいて、`, val: currentVal + 5 * multiplier });
          actions.push({ text: `「${comp5}」をはらうよ。`, val: currentVal + (5 - comp5) * multiplier });
        }
      } else {
        let comp10 = 10 - b; 
        let n1 = a % 5;
        let n5 = Math.floor(a / 5);
        
        let canSubDirectly = false;
        if (comp10 < 5) {
          if (n1 >= comp10) canSubDirectly = true;
        } else {
          if (n5 === 1 && n1 >= (comp10 - 5)) canSubDirectly = true;
        }

        let carryMultiplier = multiplier * 10;
        let chainCarry = false;
        if (!is10sColumn) {
          let current10s = Math.floor(currentVal / 10) % 10;
          if (current10s === 9) chainCarry = true;
        }

        actions.push({ text: `「${b}」はおけないから、<br>`, val: currentVal, ghost: { colIndex: is10sColumn ? 1 : 2, val: b }, isTextOnly: true }); 

        if (canSubDirectly) {
          if (chainCarry) {
            actions.push({ text: `「${comp10}」をはらって、`, val: currentVal - comp10 * multiplier });
            actions.push({ text: `でも十のくらいはいっぱいだから、9をはらって、`, val: currentVal - comp10 * multiplier - 90 });
            actions.push({ text: `百のくらいを上げるよ。`, val: currentVal - comp10 * multiplier - 90 + 100 });
          } else {
            actions.push({ text: `「${comp10}」をはらって、`, val: currentVal - comp10 * multiplier });
            actions.push({ text: `${targetColName}を上げるよ。`, val: currentVal - comp10 * multiplier + 1 * carryMultiplier });
          }
        } else {
          let addBack = b - 5;
          if (chainCarry) {
            actions.push({ text: `「${addBack}」をあげて、`, val: currentVal + addBack * multiplier });
            actions.push({ text: `5をはらって、`, val: currentVal + addBack * multiplier - 5 * multiplier });
            actions.push({ text: `でも十のくらいはいっぱいだから、9をはらって、`, val: currentVal + addBack * multiplier - 5 * multiplier - 90 });
            actions.push({ text: `百のくらいを上げるよ。`, val: currentVal + addBack * multiplier - 5 * multiplier - 90 + 100 });
          } else {
            actions.push({ text: `「${addBack}」をあげて、`, val: currentVal + addBack * multiplier });
            actions.push({ text: `5をはらって、`, val: currentVal + addBack * multiplier - 5 * multiplier });
            actions.push({ text: `${targetColName}を上げるよ。`, val: currentVal + addBack * multiplier - 5 * multiplier + 1 * carryMultiplier });
          }
        }
      }
      return actions;
    }

    function buildSteps(a, b) {
      explainSteps = [];
      let currentVal = a;
      
      let aStr = String(a).padStart(2, '0');
      let bStr = String(b).padStart(2, '0');
      
      let b10 = parseInt(bStr[0]);
      let b1 = parseInt(bStr[1]);

      explainSteps.push({
        actions: [
          { text: `まずは「${a}」をおくよ。<br>`, val: 0, isTextOnly: true },
          { text: ``, val: a }
        ],
        prevVal: 0,
        val: a,
        hissanHlTop: true,
        hissanHlBottom10: false,
        hissanHlBottom1: false,
        showResult: false
      });

      if (b10 > 0) {
        let a10 = Math.floor(currentVal / 10) % 10;
        let actions = getAddExplainInfo(a10, b10, true, currentVal, 10);
        if (actions.length > 0) {
          explainSteps.push({
            actions: actions,
            prevVal: currentVal,
            val: currentVal + b10 * 10,
            hissanHlTop: false,
            hissanHlBottom10: true,
            hissanHlBottom1: false,
            showResult: false
          });
          currentVal += b10 * 10;
        }
      }

      if (b1 > 0) {
        let a1 = currentVal % 10;
        let actions = getAddExplainInfo(a1, b1, false, currentVal, 1);
        if (actions.length > 0) {
          explainSteps.push({
            actions: actions,
            prevVal: currentVal,
            val: currentVal + b1,
            hissanHlTop: false,
            hissanHlBottom10: false,
            hissanHlBottom1: true,
            showResult: false
          });
          currentVal += b1;
        }
      }

      explainSteps.push({
        text: `<div class="text-xl leading-tight">こたえは<span class="text-4xl text-red-500 mx-1 font-black inline-block transform translate-y-1">${a + b}</span>だよ。</div>`,
        prevVal: currentVal,
        val: a + b,
        hissanHlTop: false,
        hissanHlBottom10: false,
        hissanHlBottom1: false,
        showResult: true
      });
    }

    function buildIntroSteps(num) {
      explainSteps = [];
      let text = "";
      if (num < 5) {
        text = `一のくらいに「${num}」をおくよ。`;
      } else if (num === 5) {
        text = `五だまをさげて、「5」をおくよ。`;
      } else {
        text = `5と${num-5}で、「${num}」をおくよ。`;
      }

      explainSteps.push({
        actions: [
          { text: text, val: num }
        ],
        prevVal: 0,
        val: num,
        showResult: false 
      });
      
      explainSteps.push({
        text: `<div class="text-xl leading-tight">これが<span class="text-4xl text-red-500 mx-1 font-black inline-block transform translate-y-1">${num}</span>だよ。</div>`,
        prevVal: num,
        val: num,
        showResult: true
      });
    }

    function startExplain() {
      document.getElementById('initialButtons').classList.add('hidden');
      document.getElementById('explainBox').classList.remove('hidden');
      isInteractive = false; 
      currentAnimSpeed = 0.12; 
      
      setSorobanValueInstantly(0);
      currentStep = 0;
      playStep();
    }

    function playStep() {
      let step = explainSteps[currentStep];
      
      if (mode !== 'intro') {
        document.getElementById('hTop10').classList.toggle('hissan-active', !!step.hissanHlTop);
        document.getElementById('hTop1').classList.toggle('hissan-active', !!step.hissanHlTop);
        document.getElementById('hBot10').classList.toggle('hissan-active', !!step.hissanHlBottom10);
        document.getElementById('hBot1').classList.toggle('hissan-active', !!step.hissanHlBottom1);
      }
      
      if (step.showResult) {
        if (mode !== 'intro') {
          setAnswerText();
          document.getElementById('questionTitle').innerText = `${qA} ＋ ${qB} ＝ ${step.val}`;
          document.getElementById('hResCont').classList.remove('opacity-0');
          document.getElementById('hResCont').classList.add('opacity-100');
        } else {
          document.getElementById('questionTitle').innerText = `すうじのおきかた`;
        }
        document.getElementById('explainButtons').classList.add('hidden');
        document.getElementById('nextQuestionBtn').classList.remove('hidden');
      } else {
        if (mode !== 'intro') {
          document.getElementById('questionTitle').innerText = `${qA} ＋ ${qB} ＝ ？`;
        }
        document.getElementById('explainButtons').classList.remove('hidden');
        document.getElementById('nextStepBtn').innerText = (currentStep === explainSteps.length - 2) ? "こたえをみる" : "つぎへ";
      }
      
      updateExplainText(step, -1);
      setSorobanValueInstantly(step.prevVal);
      startSorobanAnimationSequence(step);
    }

    function replayCurrentStep() {
      let step = explainSteps[currentStep];
      setSorobanValueInstantly(step.prevVal);
      startSorobanAnimationSequence(step);
    }

    function nextExplainStep() {
      if (currentStep < explainSteps.length - 1) {
        currentStep++;
        playStep();
      }
    }

    function showAnswerInstantly() {
      document.getElementById('explainBox').classList.remove('hidden');

      if (mode !== 'intro') {
        setAnswerText();
        document.getElementById('hResCont').classList.remove('opacity-0');
        document.getElementById('hResCont').classList.add('opacity-100');
        document.getElementById('questionTitle').innerText = `${qA} ＋ ${qB} ＝ ${qA + qB}`;
        document.getElementById('sorobanMessage').innerHTML = `<div class="text-xl leading-tight">こたえは<span class="text-4xl text-red-500 mx-1 font-black inline-block transform translate-y-1">${qA + qB}</span>だよ。</div>`;
      } else {
        document.getElementById('sorobanMessage').innerHTML = `<div class="text-xl leading-tight">これが<span class="text-4xl text-red-500 mx-1 font-black inline-block transform translate-y-1">${qA}</span>だよ。</div>`;
      }
      
      document.getElementById('initialButtons').classList.add('hidden');
      document.getElementById('nextQuestionBtn').classList.remove('hidden');
      
      isInteractive = false;
      clearAnimationQueue();
      currentAnimSpeed = 0.12;
      
      let targetVal = (mode === 'intro') ? qA : (qA + qB);
      
      setSorobanValueAnimatedTarget(targetVal, () => {
        playSuccessMelody();
        highlightResultBeads();
        resetColorTimeoutId = setTimeout(resetBeadsColor, 1500);
      });
    }

    function clearAnimationQueue() {
      currentAnimStep = null;
      onAnimationComplete = null;
      if (sequenceTimeoutId) {
        clearTimeout(sequenceTimeoutId);
        sequenceTimeoutId = null;
      }
      if (resetColorTimeoutId) {
        clearTimeout(resetColorTimeoutId);
        resetColorTimeoutId = null;
      }
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      if (ghostAnimationId) {
        cancelAnimationFrame(ghostAnimationId);
        ghostAnimationId = null;
      }
      ghostState.active = false;
    }

    function startSorobanAnimationSequence(step) {
      clearAnimationQueue();
      if (step.showResult) {
        document.getElementById('sorobanMessage').innerHTML = step.text;
        setSorobanValueAnimatedTarget(step.val, () => {
          playSuccessMelody();
          highlightResultBeads();
          resetColorTimeoutId = setTimeout(resetBeadsColor, 1500);
        });
        return;
      }
      
      currentAnimStep = step;
      currentActionIndex = 0;
      playNextInSequence();
    }

    function updateExplainText(step, activeIndex) {
      if (step.showResult) {
        document.getElementById('sorobanMessage').innerHTML = step.text;
        return;
      }
      
      let html = "";
      step.actions.forEach((act, idx) => {
        if (!act.text || act.text.trim() === "") return;

        let isHighlighted = false;
        if (idx === activeIndex) {
          isHighlighted = true;
        } else if (activeIndex >= 0 && (!step.actions[activeIndex].text || step.actions[activeIndex].text.trim() === "")) {
          let lastTextIdx = activeIndex;
          while (lastTextIdx >= 0 && (!step.actions[lastTextIdx].text || step.actions[lastTextIdx].text.trim() === "")) {
             lastTextIdx--;
          }
          if (idx === lastTextIdx) {
             isHighlighted = true;
          }
        }

        if (isHighlighted) {
          html += `<span class="text-red-600 font-bold bg-yellow-100 px-1 rounded transition-colors duration-300">${act.text}</span>`;
        } else {
          html += `<span class="transition-colors duration-300 text-gray-700">${act.text}</span>`;
        }
      });
      document.getElementById('sorobanMessage').innerHTML = html;
    }

    function playNextInSequence() {
      if (!currentAnimStep || !currentAnimStep.actions) return;
      
      if (currentActionIndex >= currentAnimStep.actions.length) {
        updateExplainText(currentAnimStep, -1);
        resetBeadsColor();
        return;
      }
      
      updateExplainText(currentAnimStep, currentActionIndex);
      let nextAction = currentAnimStep.actions[currentActionIndex];

      if (nextAction.ghost) {
        ghostState = {
          active: true,
          colIndex: nextAction.ghost.colIndex,
          val: nextAction.ghost.val,
          progress: 0
        };
        if (!ghostAnimationId) animateGhost();
      } else {
        ghostState.active = false;
      }

      if (nextAction.isTextOnly) {
        sequenceTimeoutId = setTimeout(() => {
          currentActionIndex++;
          playNextInSequence();
        }, 1000); 
      } else {
        setSorobanValueAnimatedTarget(nextAction.val, () => {
          currentActionIndex++;
          if (currentActionIndex < currentAnimStep.actions.length) {
            sequenceTimeoutId = setTimeout(() => {
              playNextInSequence();
            }, 500); 
          } else {
            sequenceTimeoutId = setTimeout(() => {
              updateExplainText(currentAnimStep, -1);
              resetBeadsColor();
            }, 500); 
          }
        });
      }
    }

    function highlightResultBeads() {
      activeColumns.forEach(col => {
        let state = beadState[col.id];
        let val = col.value;
        if (val >= 5) {
          state.bead5.color = 'add';
        }
        for (let i = 0; i < (val % 5); i++) {
          state.beads1[i].color = 'add';
        }
      });
      renderSoroban();
    }

    function resetBeadsColor() {
      activeColumns.forEach(col => {
        beadState[col.id].bead5.color = 'normal';
        beadState[col.id].beads1.forEach(b => b.color = 'normal');
      });
      renderSoroban();
    }

    function initSoroban() {
      beadState = {};
      activeColumns.forEach(col => {
        beadState[col.id] = {
          bead5: { y: 24, targetY: 24, color: 'normal' },
          beads1: [
            { y: 92, targetY: 92, color: 'normal' },
            { y: 120, targetY: 120, color: 'normal' },
            { y: 148, targetY: 148, color: 'normal' },
            { y: 176, targetY: 176, color: 'normal' }
          ]
        };
      });
      renderSoroban();
    }

    function renderSoroban() {
      drawSorobanFrame();
      drawAllBeads();
      drawGhostBeads();
    }

    function drawSorobanFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(0, 0, canvas.width, 10);
      ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
      ctx.fillRect(0, 0, 10, canvas.height);
      ctx.fillRect(canvas.width - 10, 0, 10, canvas.height);
      
      ctx.fillRect(0, 60, canvas.width, 6);
      
      ctx.fillStyle = "#000";
      ctx.beginPath();
      let onesCol = activeColumns.find(c => c.id === '1s');
      if (onesCol) {
        ctx.arc(onesCol.x, 63, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#A0522D";
      activeColumns.forEach(col => {
        ctx.fillRect(col.x - 2, 10, 4, canvas.height - 20);
      });
    }

    function drawAllBeads() {
      activeColumns.forEach(col => {
        let state = beadState[col.id];
        drawBead(col.x, state.bead5.y, state.bead5.color);
        state.beads1.forEach(b => {
          drawBead(col.x, b.y, b.color);
        });
      });
    }

    function drawBead(x, y, colorType = 'normal') {
      ctx.beginPath();
      ctx.ellipse(x, y, 24, 14, 0, 0, Math.PI * 2);
      
      if (colorType === 'add') {
        ctx.fillStyle = "#ef4444"; 
      } else if (colorType === 'sub') {
        ctx.fillStyle = "#3b82f6"; 
      } else if (colorType === 'ghost') {
        ctx.fillStyle = "#9ca3af"; 
      } else {
        ctx.fillStyle = "#f59e0b"; 
      }
      
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = (colorType === 'ghost') ? "#6b7280" : "#b45309";
      ctx.stroke();
      
      ctx.beginPath();
      ctx.ellipse(x, y - 4, 16, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      ctx.fill();
    }

    function drawCrossMark(x, y) {
      ctx.save();
      ctx.globalAlpha = 1.0; 
      ctx.strokeStyle = "#dc2626"; 
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x - 10, y - 8);
      ctx.lineTo(x + 10, y + 8);
      ctx.moveTo(x + 10, y - 8);
      ctx.lineTo(x - 10, y + 8);
      ctx.stroke();
      ctx.restore();
    }

    function drawGhostBeads() {
      if (!ghostState.active) return;
      if (ghostState.colIndex >= activeColumns.length) return;

      let col = activeColumns[ghostState.colIndex];
      let v = ghostState.val;
      let has5 = v >= 5;
      let n1 = v % 5;

      ctx.globalAlpha = 0.6; 

      let p = ghostState.progress;
      let ease = p * (2 - p); 

      if (has5) {
        let startY = 24; 
        let endY = 46;   
        let y = startY + (endY - startY) * ease;
        drawBead(col.x, y, 'ghost');
        if (p >= 1) drawCrossMark(col.x, y);
      }

      for (let i = 0; i < n1; i++) {
        let startY = 92 + i * 28; 
        let endY = 80 + i * 28;    
        let y = startY + (endY - startY) * ease;
        drawBead(col.x, y, 'ghost');
        if (p >= 1) drawCrossMark(col.x, y); 
      }

      ctx.globalAlpha = 1.0; 
    }

    function setSorobanValueInstantly(val) {
      clearAnimationQueue();
      let str = String(val).padStart(activeColumns.length, '0');
      
      activeColumns.forEach((col, index) => {
        let colVal = parseInt(str[index]);
        col.value = colVal;
        let state = beadState[col.id];
        let hasFive = colVal >= 5;
        let n = colVal % 5;
        
        state.bead5.y = hasFive ? 46 : 24;
        state.bead5.targetY = state.bead5.y;
        state.bead5.color = 'normal';
        
        for (let i = 0; i < 4; i++) {
          let target1 = (i < n) ? (80 + i * 28) : (176 - (3 - i) * 28);
          state.beads1[i].y = target1;
          state.beads1[i].targetY = target1;
          state.beads1[i].color = 'normal';
        }
      });
      renderSoroban();
    }

    function setSorobanValueAnimatedTarget(val, cb) {
      let str = String(val).padStart(activeColumns.length, '0');
      let changed = false;

      activeColumns.forEach((col, index) => {
        let colVal = parseInt(str[index]);
        col.value = colVal; 
        let state = beadState[col.id];
        let hasFive = colVal >= 5;
        let n = colVal % 5;
        
        let target5 = hasFive ? 46 : 24;
        if (state.bead5.targetY !== target5) {
          state.bead5.color = (target5 === 46) ? 'add' : 'sub';
          state.bead5.targetY = target5;
          changed = true;
        } else {
          state.bead5.color = 'normal';
        }
        
        for (let i = 0; i < 4; i++) {
          let target1 = (i < n) ? (80 + i * 28) : (176 - (3 - i) * 28);
          if (state.beads1[i].targetY !== target1) {
            state.beads1[i].color = (target1 < state.beads1[i].targetY) ? 'add' : 'sub'; 
            state.beads1[i].targetY = target1;
            changed = true;
          } else {
            state.beads1[i].color = 'normal';
          }
        }
      });

      if (changed) {
        playBeadSound();
        onAnimationComplete = cb;
        if (!animationId) animateSoroban();
      } else {
        activeColumns.forEach(col => {
          beadState[col.id].bead5.color = 'normal';
          beadState[col.id].beads1.forEach(b => b.color = 'normal');
        });
        renderSoroban();
        if (cb) cb();
      }
    }

    function animateGhost() {
      if (!ghostState.active) {
        ghostAnimationId = null;
        return;
      }
      
      ghostState.progress += 0.12; 
      if (ghostState.progress > 1) ghostState.progress = 1;

      renderSoroban();

      if (ghostState.progress < 1) {
        ghostAnimationId = requestAnimationFrame(animateGhost);
      } else {
        ghostAnimationId = null;
      }
    }

    function animateSoroban() {
      let isMoving = false;
      const speed = currentAnimSpeed;

      activeColumns.forEach(col => {
        let state = beadState[col.id];
        if (Math.abs(state.bead5.targetY - state.bead5.y) > 0.5) {
          state.bead5.y += (state.bead5.targetY - state.bead5.y) * speed;
          isMoving = true;
        } else {
          state.bead5.y = state.bead5.targetY;
        }
        
        state.beads1.forEach(b => {
          if (Math.abs(b.targetY - b.y) > 0.5) {
            b.y += (b.targetY - b.y) * speed;
            isMoving = true;
          } else {
            b.y = b.targetY;
          }
        });
      });

      renderSoroban();

      if (isMoving) {
        animationId = requestAnimationFrame(animateSoroban);
      } else {
        animationId = null;
        if (onAnimationComplete) {
          let cb = onAnimationComplete;
          onAnimationComplete = null;
          cb();
        }
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!isInteractive) return; 
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      activeColumns.forEach(col => {
        if (Math.abs(x - col.x) < 30) {
          let state = beadState[col.id];
          let isChanged = false;
          
          if (y > 10 && y < 60) {
            let isPlaced = (state.bead5.targetY === 46);
            state.bead5.targetY = isPlaced ? 24 : 46;
            col.value = isPlaced ? col.value - 5 : col.value + 5;
            isChanged = true;
          }
          
          if (y > 65 && y < 190) {
            let clickedIndex = -1;
            for(let i=0; i<4; i++){
               if(Math.abs(y - state.beads1[i].y) < 25) { 
                   clickedIndex = i;
                   break;
               }
            }

            if (clickedIndex !== -1) {
              let b = state.beads1[clickedIndex];
              let isPlaced = b.targetY === (80 + clickedIndex * 28);

              if (!isPlaced) {
                let current1s = col.value % 5;
                let addAmount = (clickedIndex + 1) - current1s;
                col.value += addAmount;
                for (let i = 0; i <= clickedIndex; i++) {
                   state.beads1[i].targetY = 80 + i * 28;
                }
                isChanged = true;
              } else {
                let current1s = col.value % 5;
                let subAmount = current1s - clickedIndex;
                col.value -= subAmount;
                for (let i = clickedIndex; i < 4; i++) {
                   state.beads1[i].targetY = 176 - (3 - i) * 28;
                }
                isChanged = true;
              }
            }
          }
          
          if (isChanged) {
            playBeadSound();
          }
        }
      });

      if (!animationId) animateSoroban();
    });

    window.onload = function() {
      setupCanvasForMode();
      
      const isLarge = localStorage.getItem('largeSoroban') === 'true';
      const checkbox = document.getElementById('largeSorobanCheck');
      checkbox.checked = isLarge;
      toggleLargeSoroban(isLarge);
    };

  </script>
